[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-sort-gi"
version = "0.1.0"
description = "Portfolio-based Genshin Impact artifact analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "scipy>=1.16,<2"]

[project.scripts]
artifact-sort = "artifact_sort.cli:main"

[tool.setuptools.packages.find]
include = ["artifact_sort*"]
